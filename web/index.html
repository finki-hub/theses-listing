<!doctype html>
<html lang="__LOCALIZED_LANGUAGE__">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>__LOCALIZED_TITLE__</title>
    <meta name="description" content="__LOCALIZED_DESCRIPTION__" />
    <meta name="author" content="__LOCALIZED_AUTHOR__" />

    <meta property="og:title" content="__LOCALIZED_TITLE__" />
    <meta property="og:description" content="__LOCALIZED_DESCRIPTION__" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="__LOCALIZED_URL__" />
    <meta property="og:locale" content="__LOCALIZED_LOCALE__" />
    <meta property="og:image" content="__LOCALIZED_IMAGE__" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="__LOCALIZED_TITLE__" />
    <meta name="twitter:description" content="__LOCALIZED_DESCRIPTION__" />
    <meta name="twitter:image" content="__LOCALIZED_IMAGE__" />

    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <!-- The site ships its own dark theme; stop Dark Reader from recoloring it. -->
    <meta name="darkreader-lock" />

    <script>
      // Apply the stored or system theme before first paint to avoid a flash.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('theme');
        } catch (_) {}
        var dark =
          stored === 'dark' ||
          (stored !== 'light' &&
            matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.dataset.kbTheme = dark ? 'dark' : 'light';
        root.style.colorScheme = dark ? 'dark' : 'light';
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#0a0a0a' : '#ffffff');
      })();
    </script>

    <link rel="canonical" href="__LOCALIZED_URL__" />

    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>

</html>
